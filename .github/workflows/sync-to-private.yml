name: Sync approved submissions to private repo

# When a PR is merged into Utilities-community that touches packages/**,
# copy the same package folder(s) into the private nTopology/Utilities repo
# on a new branch, then open a follow-up PR there for maintainer review.
#
# Required secret on this repo:
#   PRIVATE_REPO_TOKEN  - fine-grained PAT, repo access "nTopology/Utilities",
#                         permissions: Contents: read & write, Pull requests: read & write.

on:
  # pull_request_target (not pull_request) so PRs from forks still get
  # PRIVATE_REPO_TOKEN - GitHub withholds secrets from plain `pull_request`
  # runs triggered by a fork. Safe here because the job only runs post-merge
  # and never executes code from the fork branch itself.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    # Only run on actual merges (closing without merging skips).
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: List changed files in the merged PR
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sync
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json files \
            --jq '.files[].path' > /tmp/sync/changed.txt
          echo "Changed files:"; cat /tmp/sync/changed.txt
          if grep -q '^packages/' /tmp/sync/changed.txt; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "No packages/** changes; nothing to sync."
          fi

      - name: Stop if no package changes
        if: steps.changes.outputs.has_packages != 'true'
        run: echo "Skipping - no packages/** in this PR." && exit 0

      - name: Checkout Utilities-community at the merged commit
        if: steps.changes.outputs.has_packages == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: community
          lfs: true
          # Safe: this job only runs post-merge (see job-level `if` above), so
          # merge_commit_sha is already part of protected `main`, not
          # unreviewed fork code. actions/checkout's fork-checkout guard
          # otherwise blocks any checkout in a pull_request_target workflow.
          allow-unsafe-pr-checkout: true

      - name: Checkout private Utilities with PRIVATE_REPO_TOKEN
        if: steps.changes.outputs.has_packages == 'true'
        uses: actions/checkout@v5
        with:
          repository: nTopology/Utilities
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          fetch-depth: 0
          lfs: true

      - name: Copy package folders from community into private and push branch
        if: steps.changes.outputs.has_packages == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Original community-side PR author. We commit on the private repo
          # AS this user so they show up in the private repo's GitHub
          # contributor graph - which is what build-data.js reads for the
          # "Contributors" stat shown on community.ntop.com.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Collect unique top-level package folders from the changed-files list,
          # e.g. "packages/foo/bar/manifest.json" -> "packages/foo/bar".
          packages=$(grep '^packages/' /tmp/sync/changed.txt \
            | awk -F/ '$2 == "_schema" {print $1"/"$2; next} NF >= 3 {print $1"/"$2"/"$3}' | sort -u)
          if [ -z "$packages" ]; then
            echo "No top-level package folders detected."
            exit 0
          fi
          echo "Will sync these package folders:"
          echo "$packages"

          cd "$GITHUB_WORKSPACE/private"
          # Commit AS the original contributor so the private repo's
          # contributor graph (used by build-data.js) credits them. The
          # @users.noreply.github.com address is the standard GitHub format
          # that GitHub maps back to a login when generating the graph.
          git config user.name  "${PR_AUTHOR}"
          git config user.email "${PR_AUTHOR}@users.noreply.github.com"

          BRANCH="sync/community-pr-${PR_NUMBER}"
          git checkout -B "$BRANCH"

          : > /tmp/sync/added.txt
          : > /tmp/sync/updated.txt
          : > /tmp/sync/deleted.txt

          # rsync each package folder community -> private. --delete handles
          # file removals inside the same package; we never touch other folders.
          # If the package folder no longer exists in community at all (the
          # whole package was deleted), remove it from private too.
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue

            if [ ! -d "../community/$pkg" ]; then
              if [ -d "$pkg" ]; then
                echo "Package removed in community, deleting from private: $pkg"
                git rm -r --ignore-unmatch --quiet "$pkg"
                echo "$pkg" >> /tmp/sync/deleted.txt
              fi
              continue
            fi

            pkg_existed=false
            [ -d "$pkg" ] && pkg_existed=true

            mkdir -p "$pkg"

            # featured/verified are private-repo-only controls; the community
            # manifest never sets them. Preserve whatever's already there
            # before rsync overwrites manifest.json wholesale.
            PRESERVE="{}"
            if [ -f "$pkg/manifest.json" ]; then
              PRESERVE=$(jq -c '{featured, verified} | with_entries(select(.value != null))' "$pkg/manifest.json")
            fi

            rsync -av --delete "../community/$pkg/" "$pkg/"

            if [ -f "$pkg/manifest.json" ]; then
              # Stamp communitySource so the private repo knows this package
              # originated from the community repo (used for commit history link),
              # and restore the preserved private-only fields.
              jq --argjson preserve "$PRESERVE" '. + {"communitySource": true} + $preserve' \
                "$pkg/manifest.json" > /tmp/_manifest.json \
                && mv /tmp/_manifest.json "$pkg/manifest.json"
            fi
            git add "$pkg"

            if ! git diff --cached --quiet -- "$pkg"; then
              if [ "$pkg_existed" = true ]; then
                echo "$pkg" >> /tmp/sync/updated.txt
              else
                echo "$pkg" >> /tmp/sync/added.txt
              fi
            fi
          done <<< "$packages"

          if git diff --cached --quiet; then
            echo "No effective changes to sync (community state matches private)."
            exit 0
          fi

          git commit -m "Sync community PR #${PR_NUMBER}: ${PR_TITLE}"
          git push -u origin "$BRANCH" --force

      - name: Open follow-up PR on private repo
        if: steps.changes.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          BRANCH="sync/community-pr-${PR_NUMBER}"

          # If a PR for this branch already exists (re-run), don't duplicate.
          EXISTING=$(gh pr list --repo nTopology/Utilities --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Follow-up PR already exists: #$EXISTING"
            exit 0
          fi

          format_list() {
            if [ -s "$1" ]; then
              sed 's/^/- /' "$1"
            else
              echo "_none_"
            fi
          }

          BODY=$(cat <<EOF
          Auto-synced from \`nTopology/Utilities-community\` PR [#${PR_NUMBER}](${PR_URL}) by @${PR_AUTHOR}.

          The contributor PR was reviewed on the public mirror; this follow-up PR
          carries the same files into the private source repo so the next deploy
          can publish them on community.ntop.com.

          **Packages added:**
          $(format_list /tmp/sync/added.txt)

          **Packages updated:**
          $(format_list /tmp/sync/updated.txt)

          **Packages deleted:**
          $(format_list /tmp/sync/deleted.txt)

          ---

          Approve and merge when ready. CI will run \`scripts/validate-manifests.js\`
          on the changed manifests before the deploy step.
          EOF
          )

          gh pr create \
            --repo nTopology/Utilities \
            --base main \
            --head "$BRANCH" \
            --title "[sync] ${PR_TITLE}" \
            --body "$BODY"
